<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易 Vuex 4 实现（修复版）</title>
  <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
  <script src="vuex.js"></script> <!-- 引入提炼的 Vuex 核心代码 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 30px 0;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    .panel {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .panel:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffcc00;
      border-bottom: 2px solid rgba(255, 204, 0, 0.3);
      padding-bottom: 10px;
    }
    .state-display {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .state-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .state-item:last-child {
      border-bottom: none;
    }
    .state-label {
      font-weight: 600;
      opacity: 0.85;
    }
    .state-value {
      font-weight: 700;
      color: #4dff4d;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    button {
      background: linear-gradient(45deg, #2193b0, #6dd5ed);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    button:active {
      transform: translateY(1px);
    }
    button.danger {
      background: linear-gradient(45deg, #f85032, #e73827);
    }
    button.warning {
      background: linear-gradient(45deg, #ff8008, #ffc837);
    }
    button.success {
      background: linear-gradient(45deg, #00b09b, #96c93d);
    }
    .namespace {
      display: inline-block;
      background: rgba(255, 204, 0, 0.2);
      color: #ffcc00;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
      margin: 0 5px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      opacity: 0.8;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .panels {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2.2rem;
      }
    }
    .price-value {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .empty-cart {
      color: #ff9999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <header>
        <h1>简易 Vuex 4 实现（修复版）</h1>
        <p class="subtitle">已修复最终价格显示问题，核心代码提炼到单独文件</p>
      </header>

      <div class="panels">
        <div class="panel">
          <h2>用户模块 <span class="namespace">user</span></h2>
          
          <div class="state-display">
            <div class="state-item">
              <span class="state-label">用户名:</span>
              <span class="state-value">{{ username }}</span>
            </div>
            <div class="state-item">
              <span class="state-label">用户ID:</span>
              <span class="state-value">{{ userId || '未登录' }}</span>
            </div>
            <div class="state-item">
              <span class="state-label">用户角色:</span>
              <span class="state-value">{{ userRole }}</span>
            </div>
            <div class="state-item">
              <span class="state-label">欢迎消息:</span>
              <span class="state-value">{{ welcomeMessage }}</span>
            </div>
          </div>
          
          <div class="controls">
            <button @click="login">登录用户</button>
            <button @click="logout" class="danger">登出用户</button>
            <button @click="changeRole">切换角色</button>
          </div>
        </div>
        
        <div class="panel">
          <h2>购物车模块 <span class="namespace">cart</span></h2>
          
          <div class="state-display">
            <div class="state-item">
              <span class="state-label">商品数量:</span>
              <span class="state-value">{{ cartItems.length }}</span>
            </div>
            <div class="state-item">
              <span class="state-label">总金额:</span>
              <span class="state-value price-value">¥{{ cartTotal.toFixed(2) }}</span>
            </div>
            <div class="state-item">
              <span class="state-label">折扣:</span>
              <span class="state-value price-value">{{ discount }}%</span>
            </div>
            <div class="state-item">
              <span class="state-label">最终价格:</span>
              <span class="state-value price-value">
                <template v-if="cartItems.length > 0">
                  ¥{{ discountedTotal.toFixed(2) }}
                </template>
                <span v-else class="empty-cart">购物车为空</span>
              </span>
            </div>
          </div>
          
          <div class="controls">
            <button @click="addItem">添加商品</button>
            <button @click="removeItem" class="danger">移除商品</button>
            <button @click="applyDiscount" class="warning">应用折扣</button>
            <button @click="clearCart" class="danger">清空购物车</button>
          </div>
        </div>
      </div>
      
      <footer>
        <p>简易 Vuex 4 实现 - 支持命名空间模块和映射辅助函数</p>
      </footer>
    </div>
  </div>

  <script>
    // 创建 Vuex store
    const store = createStore({
      state: {
        appName: "Vuex 4 实现演示"
      },
      modules: {
        user: {
          namespaced: true,
          state: {
            username: '游客',
            userId: null,
            role: 'guest'
          },
          mutations: {
            setUser(state, payload) {
              state.username = payload.username;
              state.userId = payload.id;
              state.role = payload.role || 'user';
            },
            logout(state) {
              state.username = '游客';
              state.userId = null;
              state.role = 'guest';
            },
            changeRole(state) {
              state.role = state.role === 'admin' ? 'user' : 'admin';
            }
          },
          actions: {
            login({ commit }) {
              return new Promise(resolve => {
                setTimeout(() => {
                  commit('setUser', {
                    username: '张三',
                    id: 1001,
                    role: 'admin'
                  });
                  resolve();
                }, 500);
              });
            }
          },
          getters: {
            welcomeMessage(state) {
              return `欢迎, ${state.username} (${state.role})`;
            },
            userRole(state) {
              return state.role.toUpperCase();
            }
          }
        },
        cart: {
          namespaced: true,
          state: {
            items: [],
            discount: 0
          },
          mutations: {
            addItem(state, item) {
              state.items.push(item);
            },
            removeItem(state) {
              if (state.items.length > 0) {
                state.items.pop();
              }
            },
            clearCart(state) {
              state.items = [];
              state.discount = 0;
            },
            setDiscount(state, value) {
              state.discount = value;
            }
          },
          actions: {
            applyDiscount({ commit, state }) {
              return new Promise(resolve => {
                setTimeout(() => {
                  const discount = state.items.length >= 3 ? 15 : 5;
                  commit('setDiscount', discount);
                  resolve(discount);
                }, 300);
              });
            }
          },
          getters: {
            cartTotal(state) {
              return state.items.reduce((sum, item) => sum + item.price, 0);
            },
            // 修复：确保数值计算正确
            discountedTotal(state, getters) {
              const total = getters.cartTotal;
              return total * (1 - state.discount / 100);
            },
            cartItems(state) {
              return state.items;
            },
            discount(state) {
              return state.discount;
            }
          }
        }
      }
    });
    
    // 创建 Vue 应用
    const app = Vue.createApp({
      computed: {
        ...mapState('user', ['username', 'userId']),
        ...mapGetters('user', ['welcomeMessage', 'userRole']),
        
        ...mapState('cart', ['items']),
        ...mapGetters('cart', ['cartTotal', 'discountedTotal', 'discount', 'cartItems'])
      },
      methods: {
        ...mapActions('user', ['login']),
        ...mapMutations('user', ['logout', 'changeRole']),
        
        ...mapActions('cart', ['applyDiscount']),
        ...mapMutations('cart', ['addItem', 'removeItem', 'clearCart']),
        
        addItem() {
          const items = [
            { name: '商品 A', price: 100 },
            { name: '商品 B', price: 200 },
            { name: '商品 C', price: 150 },
            { name: '商品 D', price: 80 }
          ];
          const randomItem = items[Math.floor(Math.random() * items.length)];
          this.$store.commit('cart/addItem', randomItem);
        }
      }
    });
    
    // 安装 Vuex store
    app.use(store);
    app.mount('#app');
  </script>
</body>
</html>
